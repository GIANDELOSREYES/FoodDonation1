<div class="login-page" style="min-height: 90vh; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width: 28rem; padding: 1.5rem;">
    <h3 style="text-align:center; margin-bottom: 1rem;">Login</h3>

    <div style="margin-bottom: 1rem;">
      <label>Username:</label>
      <input class="form-control" [ngModel]="username()" (ngModelChange)="username.set($event)" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label>Password:</label>
      <input type="password" class="form-control" [ngModel]="password()" (ngModelChange)="password.set($event)" />
    </div>

    <div style="display:flex; justify-content:flex-start; align-items:center; gap:8px;">
      <button class="btn btn-primary" (click)="login()">Login</button>
    </div>
  </div>
</div>
