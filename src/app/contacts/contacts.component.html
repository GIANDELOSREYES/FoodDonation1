<body>
    
    <div style="background-color: rgba(0,0,0,0.8); z-index: 2; width: 100%; min-height: 130vh;">
            <h4>Do you have inquiries?</h4>
                <div class="content"> 
                <div style="display: flex; flex-direction: column;">
                    <label>Title:</label>
                    <input type="text" placeholder="Subject of your inquery" [(ngModel)]="Title" reaquired>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label>Food Donation:</label>
                    <input type="text" placeholder="Your Posted Food Donation" [(ngModel)]="Food">
                </div>
                <div style="display: flex; flex-direction: row; width: 100%; gap: 1rem;">
                    <div style="display: flex; flex-direction: column; width: 50%;">
                        <label>Contact:</label>
                        <input type="text" placeholder="Your email or phone number" [(ngModel)]="contactInformation" required>
                    </div>
                    <div style="display: flex; flex-direction: column; width: 50%;">
                        <label>Donor Name:</label>
                        <input type="text" placeholder="Your name" [(ngModel)]="donorName" required>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; margin-top: 1rem;">
                    <label>Message:</label>
                    <textarea rows="5" placeholder="Type your message here..." [(ngModel)]="Message" required></textarea>
                </div>

                <div class="mt-3">
                    <label for="formFile" class="form-label">Upload a file (optional)</label>
                    <input class="form-control" type="file" id="formFile" (change)="onFileSelected($event)" accept="image/*">
                </div>

                <button (click)="onSubmit()">Submit</button>
            </div>
    </div>

</body>
